[package]
name = "ahjoor-common"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[features]
default = ["contract"]
# Compiles the `ReputationRegistry` contract. Crates that only need the shared
# helpers or the registry client can depend on this crate with
# `default-features = false`.
contract = []
